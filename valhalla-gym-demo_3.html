<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Valhalla Gym — Sistema de gestión</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #0a0a0a;
  --bg-elev: #141414;
  --bg-elev-2: #1c1c1c;
  --white: #f4f4f1;
  --white-pure: #ffffff;
  --dim: #8a8a84;
  --line: #2a2a2a;
  --line-strong: #454540;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  width: 100%;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
*:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
button, input, select { font-family: inherit; }

/* ===================== VISTA PREVIA ===================== */
.vg-preview-tag { text-align: center; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); padding: 16px; border-bottom: 1px solid var(--line); background: var(--bg); }

/* ===================== APP ===================== */
.vg-shell { display: flex; min-height: 100vh; }

.vg-sidebar { width: 232px; flex-shrink: 0; background: var(--bg-elev); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 26px 18px; }
.vg-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.vg-brand-mark { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-strong); flex-shrink: 0; overflow: hidden; background: #000; }
.vg-brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vg-brand-name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; line-height: 1.25; color: var(--white); }
.vg-brand-sub { font-size: 10px; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; margin-top: 2px; }
.vg-rule { height: 8px; background-image: radial-gradient(circle, var(--line-strong) 1.4px, transparent 1.4px); background-size: 13px 8px; background-position: left; opacity: 0.7; margin: 18px 0 22px; }
.vg-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.vg-nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 9px; background: transparent; border: 1px solid transparent; border-left: 2px solid transparent; color: var(--dim); font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; width: 100%; }
.vg-nav-item:hover { background: var(--bg-elev-2); color: var(--white); }
.vg-nav-item-active { background: var(--bg-elev-2); color: var(--white-pure); border-left: 2px solid var(--white); }
.vg-sidebar-foot { font-size: 10.5px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; line-height: 1.5; }
.vg-reset-link { background: none; border: none; color: var(--dim); text-decoration: underline; font-size: 10.5px; cursor: pointer; padding: 0; margin-top: 8px; }
.vg-reset-link:hover { color: var(--white); }

.vg-main { flex: 1; min-width: 0; padding: 36px 44px 60px; }
.vg-page-head { margin-bottom: 26px; }
.vg-eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin-bottom: 6px; }
.vg-title { font-family: 'Cinzel', serif; font-size: 26px; font-weight: 600; color: var(--white-pure); }
.vg-sub { font-size: 13.5px; color: var(--dim); margin-top: 6px; }

.vg-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 30px; }
.vg-kpi { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 16px; border-left: 2px solid var(--line-strong); }
.vg-kpi-urgent { border-left: 3px solid var(--white); }
.vg-kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 600; margin-bottom: 8px; }
.vg-kpi-value { font-family: 'Cinzel', serif; font-size: 26px; color: var(--white-pure); }

.vg-card { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
.vg-section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--white); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.vg-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.vg-three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }

.vg-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.vg-search { display: flex; align-items: center; gap: 8px; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; flex: 1; min-width: 180px; max-width: 340px; }
.vg-search input { background: transparent; border: none; outline: none; color: var(--white); font-size: 14px; width: 100%; }
.vg-search svg { color: var(--dim); flex-shrink: 0; }
.vg-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.vg-chip { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg-elev); color: var(--dim); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.vg-chip:hover { border-color: var(--line-strong); color: var(--white); }
.vg-chip-active { background: var(--white); border-color: var(--white); color: #000; }
.vg-chip-del { margin-left: 6px; opacity: .6; }
.vg-chip-del:hover { opacity: 1; }
.vg-spacer { flex: 1; }

.vg-btn { padding: 10px 16px; border-radius: 9px; font-weight: 600; font-size: 13.5px; cursor: pointer; border: 1px solid var(--line); background: var(--bg-elev-2); color: var(--white); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.vg-btn:hover { border-color: var(--line-strong); }
.vg-btn-primary { background: var(--white); color: #000; border-color: var(--white); }
.vg-btn-primary:hover { opacity: .85; }
.vg-btn-ghost { background: transparent; border-color: transparent; padding: 7px 9px; color: var(--dim); }
.vg-btn-ghost:hover { background: var(--bg-elev-2); border-color: var(--line); color: var(--white); }
.vg-btn-danger-ghost { background: transparent; border-color: transparent; padding: 7px 9px; color: var(--dim); }
.vg-btn-danger-ghost:hover { background: var(--bg-elev-2); border-color: var(--line); color: var(--white); }
.vg-btn-block { width: 100%; justify-content: center; }
.vg-btn:disabled { opacity: .5; cursor: not-allowed; }
.vg-icon-row { display: flex; gap: 4px; }

.vg-table-wrap { overflow-x: auto; }
.vg-table { width: 100%; border-collapse: collapse; min-width: 680px; }
.vg-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
.vg-table td { padding: 13px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
.vg-table tr:last-child td { border-bottom: none; }
.vg-table tr:hover td { background: rgba(255,255,255,0.015); }
.vg-name-cell { font-weight: 600; color: var(--white); }
.vg-link { cursor: pointer; }
.vg-link:hover { text-decoration: underline; }
.vg-dim { color: var(--dim); }
.vg-mono { font-variant-numeric: tabular-nums; }

.vg-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 20px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid; }
.vg-badge-activo { color: var(--white); border-color: var(--line-strong); background: transparent; }
.vg-badge-porvencer { color: var(--white); border: 1px dashed var(--white); background: transparent; }
.vg-badge-vencido { background: var(--white); color: #000; border-color: var(--white); }
.vg-badge-congelado { color: var(--dim); border-color: var(--line); background: transparent; }
.vg-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.vg-dot-fill { background: var(--white); }
.vg-dot-hollow { border: 1px solid var(--white); background: transparent; }
.vg-dot-dim { background: var(--dim); }

.vg-empty { text-align: center; padding: 48px 20px; color: var(--dim); }
.vg-empty svg { color: var(--line-strong); margin-bottom: 14px; }
.vg-empty-title { color: var(--white); font-weight: 600; margin-bottom: 6px; font-size: 15px; }
.vg-empty-sub { font-size: 13px; margin-bottom: 18px; }

.vg-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
.vg-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.vg-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
.vg-input, .vg-select { background: var(--bg); border: 1px solid var(--line); color: var(--white); padding: 10px 12px; border-radius: 8px; font-size: 14px; width: 100%; }
.vg-input:focus, .vg-select:focus { outline: none; border-color: var(--white); box-shadow: 0 0 0 3px rgba(255,255,255,0.08); }
.vg-hint { font-size: 11.5px; color: var(--dim); }
.vg-check-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 13.5px; }
.vg-check-row input { width: 17px; height: 17px; accent-color: var(--white); }

.vg-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.78); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; backdrop-filter: blur(2px); }
.vg-modal { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; padding: 26px 26px 24px; }
.vg-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.vg-modal-title { font-family: 'Cinzel', serif; font-size: 18px; color: var(--white-pure); }
.vg-modal-foot { display: flex; gap: 10px; margin-top: 6px; }
.vg-close-x { background: transparent; border: none; color: var(--dim); cursor: pointer; padding: 4px; border-radius: 6px; display: flex; }
.vg-close-x:hover { color: var(--white); background: var(--bg-elev-2); }

.vg-plan-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.vg-plan-chip { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--dim); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.vg-plan-chip-active { border-color: var(--white); color: var(--white-pure); background: var(--bg-elev-2); }

.vg-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--bg-elev-2); border: 1px solid var(--line-strong); color: var(--white); padding: 12px 20px; border-radius: 10px; font-size: 13.5px; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; }
.vg-toast-error { border-color: var(--white); }

.vg-mini-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.vg-mini-item:last-child { border-bottom: none; }
.vg-mini-name { font-weight: 600; color: var(--white); }
.vg-mini-sub { font-size: 11.5px; color: var(--dim); margin-top: 2px; }

.vg-bar-row { display: grid; grid-template-columns: 118px 1fr 96px; align-items: center; gap: 12px; margin-bottom: 15px; }
.vg-bar-row:last-child { margin-bottom: 0; }
.vg-bar-label { font-size: 12.5px; color: var(--dim); }
.vg-bar-track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.vg-bar-fill { height: 100%; background: var(--white); border-radius: 5px; }
.vg-bar-fill-dim { background: var(--dim); }
.vg-bar-value { font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }

@media (max-width: 860px) {
  .vg-kpi-row { grid-template-columns: repeat(2, 1fr); }
  .vg-two-col, .vg-three-col { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .vg-shell { flex-direction: column; }
  .vg-sidebar { width: 100%; flex-direction: row; align-items: center; padding: 10px 14px; order: 2; position: sticky; bottom: 0; border-right: none; border-top: 1px solid var(--line); gap: 10px; z-index: 40; }
  .vg-brand, .vg-rule, .vg-sidebar-foot { display: none; }
  .vg-nav { flex-direction: row; gap: 4px; overflow-x: auto; }
  .vg-nav-item { flex-direction: column; gap: 3px; padding: 8px 10px; font-size: 10.5px; border-left: none; border-top: 2px solid transparent; }
  .vg-nav-item-active { border-left: none; border-top: 2px solid var(--white); }
  .vg-main { padding: 18px 16px 24px; order: 1; }
  .vg-kpi-row { grid-template-columns: repeat(2, 1fr); }
  .vg-row2 { grid-template-columns: 1fr; }
  .vg-title { font-size: 21px; }
  .vg-bar-row { grid-template-columns: 84px 1fr 78px; gap: 8px; }
}
</style>
</head>
<body>

<div id="app-live-wrapper">
  <div class="vg-preview-tag">Vista previa · datos de ejemplo · se guardan solo en este dispositivo</div>
  <div id="app"></div>
</div>

<script>
/* ============================================================
   ICONOS (SVG en línea, sin dependencias externas)
   ============================================================ */
const ICN = {
  grid:(s=17)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>`,

  wallet:(s=17)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h13a1 1 0 011 1v3"></path><path d="M3 7v11a2 2 0 002 2h14a2 2 0 002-2v-8a2 2 0 00-2-2H6a2 2 0 01-2-2z"></path><circle cx="16.5" cy="14" r="1.3"></circle></svg>`,

  search:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>`,
  pencil:(s=15)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg>`,

  alert:(s=15)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L2.5 17a1.5 1.5 0 001.3 2.3h16.4a1.5 1.5 0 001.3-2.3L13.7 3.9a1.5 1.5 0 00-2.6 0z"></path><line x1="12" y1="9" x2="12" y2="13.5"></line><circle cx="12" cy="16.5" r="0.6" fill="currentColor" stroke="none"></circle></svg>`,

  snow:(s=13)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="22"></line><line x1="4.9" y1="6" x2="19.1" y2="18"></line><line x1="4.9" y1="18" x2="19.1" y2="6"></line></svg>`,
  cart:(s=15)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle><path d="M2.5 3h2l2.6 12.3a2 2 0 002 1.7h8.4a2 2 0 002-1.6L21 8H6"></path></svg>`,
  trend:(s=15)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"></polyline><polyline points="15 6 21 6 21 12"></polyline></svg>`,

};

/* ============================================================
   HELPERS
   ============================================================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => new Date().toISOString().slice(0, 10);
function addDays(iso, days) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + Number(days)); return d.toISOString().slice(0, 10); }
function daysDiff(iso) { const t = new Date(todayISO() + "T00:00:00"); const g = new Date(iso + "T00:00:00"); return Math.round((g - t) / 86400000); }
function formatDate(iso) { if (!iso) return "—"; const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; }
function money(n) { return "L " + Number(n||0).toLocaleString("es-HN", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(str) { return String(str==null?"":str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function estadoSocio(s) { if (s.congelado) return "congelado"; const d = daysDiff(s.fechaVencimiento); if (d < 0) return "vencido"; if (d <= 5) return "porvencer"; return "activo"; }
const ESTADO_LABEL = { activo:"Activo", porvencer:"Por vencer", vencido:"Vencido", congelado:"Congelado" };
const PLANES = [{nombre:"Semanal",dias:7},{nombre:"Quincenal",dias:15},{nombre:"Mensual",dias:30},{nombre:"Trimestral",dias:90}];

function badgeHTML(estado) {
  if (estado === "vencido") return `<span class="vg-badge vg-badge-vencido">Vencido</span>`;
  const dot = estado==="activo" ? "vg-dot-fill" : estado==="porvencer" ? "vg-dot-hollow" : "vg-dot-dim";
  return `<span class="vg-badge vg-badge-${estado}"><span class="vg-dot ${dot}"></span>${ESTADO_LABEL[estado]}</span>`;

const kpiHTML = (label, value, urgent) => `<div class="vg-kpi ${urgent?"vg-kpi-urgent":""}"><div class="vg-kpi-label">${label}</div><div class="vg-kpi-value">${value}</div></div>`;

function barCompareHTML(rows) {
  const max = Math.max(...rows.map(r=>r.val), 1);
  return rows.map((r,i)=>`
    <div class="vg-bar-row">
      <div class="vg-bar-label">${r.label}</div>
      <div class="vg-bar-track"><div class="vg-bar-fill ${i>0?"vg-bar-fill-dim":""}" style="width:${Math.round((r.val/max)*100)}%"></div></div>
      <div class="vg-bar-value">${money(r.val)}</div>
    </div>`).join("");
}

/* ============================================================
   RENDER (con preservación de foco/cursor en inputs)
   ============================================================ */
function render() {
  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id;
  const selStart = activeEl && "selectionStart" in activeEl ? activeEl.selectionStart : null;
  const selEnd = activeEl && "selectionEnd" in activeEl ? activeEl.selectionEnd : null;

  document.getElementById("app").innerHTML = appHTML();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch(e) {} }
    }
  }
  if (state.toast) {
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => { state.toast = null; render(); }, 2600);
  }
}

function mostrarToast(msg, tipo) { state.toast = {msg, tipo: tipo || "ok"}; render(); }

/* ============================================================
   VISTA: DASHBOARD
   ============================================================ */
function dashboardHTML() {
  const activos = state.socios.filter(s => estadoSocio(s)==="activo").length;
  const porVencer = state.socios.filter(s => estadoSocio(s)==="porvencer");
  const vencidos = state.socios.filter(s => estadoSocio(s)==="vencido");
  const stockBajo = state.productos.filter(p => Number(p.stock) <= Number(p.stockMin));
  const mesActual = todayISO().slice(0,7);
  const ingresosMensualidades = state.socios.reduce((sum,s) => sum + s.historial.filter(h=>h.fecha.slice(0,7)===mesActual).reduce((a,h)=>a+Number(h.monto),0), 0);
  const ingresosVentas = state.ventas.filter(v=>v.fecha.slice(0,7)===mesActual).reduce((a,v)=>a+Number(v.total),0);

  return `
  <div class="vg-page-head">
    <div class="vg-eyebrow">Panel general</div>
    <div class="vg-title">Bienvenido de vuelta</div>
    <div class="vg-sub">Así está el gimnasio hoy, ${formatDate(todayISO())}.</div>
  </div>
  <div class="vg-kpi-row">
    ${kpiHTML("Socios activos", activos)}
    ${kpiHTML("Por vencer (≤5 días)", porVencer.length)}
    ${kpiHTML("Morosos", vencidos.length, true)}
    ${kpiHTML("Ingresos del mes", money(ingresosMensualidades+ingresosVentas))}
  </div>
  <div class="vg-two-col">
    <div class="vg-card">
      <div class="vg-section-title">${ICN.clock(15)} Vencen pronto</div>
      ${porVencer.length===0 ? `<div class="vg-hint">Nadie vence en los próximos 5 días.</div>` :
        porVencer.sort((a,b)=>daysDiff(a.fechaVencimiento)-daysDiff(b.fechaVencimiento)).slice(0,6).map(s=>`
        <div class="vg-mini-item"><div><div class="vg-mini-name">${esc(s.nombre)}</div><div class="vg-mini-sub">${esc(s.planNombre)} · ${money(s.precio)}</div></div>${badgeHTML("porvencer")}</div>
      `).join("")}
    </div>
    <div class="vg-card">
      <div class="vg-section-title">${ICN.alert(15)} Morosos</div>
      ${vencidos.length===0 ? `<div class="vg-hint">No hay socios con mensualidad vencida.</div>` :
        vencidos.sort((a,b)=>daysDiff(a.fechaVencimiento)-daysDiff(b.fechaVencimiento)).slice(0,6).map(s=>`
        <div class="vg-mini-item"><div><div class="vg-mini-name">${esc(s.nombre)}</div><div class="vg-mini-sub">Venció hace ${Math.abs(daysDiff(s.fechaVencimiento))} día(s)</div></div>${badgeHTML("vencido")}</div>
      `).join("")}
    </div>
  </div>
  <div class="vg-card">
    <div class="vg-section-title">${ICN.package(15)} Stock bajo</div>
    ${stockBajo.length===0 ? `<div class="vg-hint">Todo el inventario está por encima de su mínimo.</div>` :
      stockBajo.map(p=>`
      <div class="vg-mini-item"><div><div class="vg-mini-name">${esc(p.nombre)}</div><div class="vg-mini-sub">Quedan ${p.stock} · mínimo ${p.stockMin}</div></div><span class="vg-badge vg-badge-vencido">Reponer</span></div>
    `).join("")}
  </div>`;
}

/* ============================================================
   VISTA: SOCIOS
   ============================================================ */
function setBusquedaSocio(v) { state.busquedaSocio = v; render(); }
function setFiltroSocio(v) { state.filtroSocio = v; render(); }

function sociosHTML() {
  const conteos = {
    todos: state.socios.length,
    activo: state.socios.filter(s=>estadoSocio(s)==="activo").length,
    porvencer: state.socios.filter(s=>estadoSocio(s)==="porvencer").length,
    vencido: state.socios.filter(s=>estadoSocio(s)==="vencido").length,
    congelado: state.socios.filter(s=>estadoSocio(s)==="congelado").length,
  };
  const filtrados = state.socios
    .filter(s => state.filtroSocio==="todos" ? true : estadoSocio(s)===state.filtroSocio)
    .filter(s => s.nombre.toLowerCase().includes(state.busquedaSocio.toLowerCase()) || (s.telefono||"").includes(state.busquedaSocio))
    .sort((a,b)=>daysDiff(a.fechaVencimiento)-daysDiff(b.fechaVencimiento));

  return `
  <div class="vg-page-head">
    <div class="vg-eyebrow">Socios</div>
    <div class="vg-title">Mensualidades y vencimientos</div>
    <div class="vg-sub">Registra pagos y controla quién debe, sin perseguir a nadie de memoria.</div>
  </div>
  <div class="vg-toolbar">
    <div class="vg-search">${ICN.search(16)}<input id="input-busqueda-socio" placeholder="Buscar por nombre o teléfono…" value="${esc(state.busquedaSocio)}" oninput="setBusquedaSocio(this.value)"></div>
    <div class="vg-chips">
      <button class="vg-chip ${state.filtroSocio==='todos'?'vg-chip-active':''}" onclick="setFiltroSocio('todos')">Todos (${conteos.todos})</button>
      <button class="vg-chip ${state.filtroSocio==='activo'?'vg-chip-active':''}" onclick="setFiltroSocio('activo')">Activos (${conteos.activo})</button>
      <button class="vg-chip ${state.filtroSocio==='porvencer'?'vg-chip-active':''}" onclick="setFiltroSocio('porvencer')">Por vencer (${conteos.porvencer})</button>
      <button class="vg-chip ${state.filtroSocio==='vencido'?'vg-chip-active':''}" onclick="setFiltroSocio('vencido')">Vencidos (${conteos.vencido})</button>
      <button class="vg-chip ${state.filtroSocio==='congelado'?'vg-chip-active':''}" onclick="setFiltroSocio('congelado')">Congelados (${conteos.congelado})</button>
    </div>
    <div class="vg-spacer"></div>
    <button class="vg-btn vg-btn-primary" onclick="abrirModal('socio', null)">${ICN.plus(16)} Nuevo socio</button>
  </div>
  <div class="vg-card" style="padding:0">
    ${filtrados.length===0 ? emptyHTML("users",
        state.socios.length===0 ? "Aún no hay socios registrados" : "Nadie coincide con ese filtro",
        state.socios.length===0 ? "Agrega el primero para empezar a controlar mensualidades." : "Prueba con otra búsqueda o filtro.",
        state.socios.length===0 ? "Agregar socio" : null,
        `onclick="abrirModal('socio', null)"`) : `
    <div class="vg-table-wrap"><table class="vg-table">
      <thead><tr><th>Nombre</th><th>Teléfono</th><th>Plan</th><th>Vence</th><th>Estado</th><th></th></tr></thead>
      <tbody>
        ${filtrados.map(s=>{
          const est = estadoSocio(s);
          const puedeRecordar = (est==="porvencer" || est==="vencido") && s.telefono;
          return `
        <tr>
          <td class="vg-name-cell vg-link" onclick="abrirModal('historial','${s.id}')" title="Ver historial de pagos">${esc(s.nombre)}</td>
          <td class="vg-dim">${esc(s.telefono)||"—"}</td>
          <td>${esc(s.planNombre)} · <span class="vg-dim">${money(s.precio)}</span></td>
          <td class="vg-mono">${formatDate(s.fechaVencimiento)}</td>
          <td>${badgeHTML(est)}</td>
          <td><div class="vg-icon-row">
            ${puedeRecordar ? `<button class="vg-btn vg-btn-ghost" title="Recordar por WhatsApp" onclick="recordarWhatsApp('${s.id}')">${ICN.chat(15)}</button>` : ""}
            <button class="vg-btn vg-btn-ghost" title="Registrar pago" onclick="abrirModal('pago','${s.id}')">${ICN.wallet(15)}</button>
            <button class="vg-btn vg-btn-ghost" title="Editar" onclick="abrirModal('socio','${s.id}')">${ICN.pencil(15)}</button>
            <button class="vg-btn vg-btn-danger-ghost" title="Eliminar" onclick="eliminarSocio('${s.id}')">${ICN.trash(15)}</button>
          </div></td>
        </tr>`;}).join("")}
      </tbody>
    </table></div>`}
  </div>`;
}

function eliminarSocio(id) {
  const s = state.socios.find(x=>x.id===id);
  if (!s) return;
  if (!confirm(`¿Eliminar a ${s.nombre}? Esta acción no se puede deshacer.`)) return;
  state.socios = state.socios.filter(x=>x.id!==id);
  guardar(); render(); mostrarToast("Socio eliminado.");
}

function recordarWhatsApp(id) {
  const s = state.socios.find(x=>x.id===id);
  if (!s || !s.telefono) return;
  const numero = "504" + s.telefono.replace(/\D/g,"");
  const est = estadoSocio(s);
  const msg = est === "vencido"
    ? `Hola ${s.nombre}, notamos que tu membresía en Valhalla Gym venció el ${formatDate(s.fechaVencimiento)}. Te esperamos para ponerte al día.`
    : `Hola ${s.nombre}, tu membresía en Valhalla Gym vence el ${formatDate(s.fechaVencimiento)}. ¿Nos vemos pronto para renovarla?`;
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`, "_blank");
}

  const nombreCat = (id) => (state.categorias.find(c=>c.id===id)||{}).nombre || "Sin categoría";

  return `
  <div class="vg-page-head">
    <div class="vg-eyebrow">Inventario</div>
    <div class="vg-title">Productos y stock</div>
    <div class="vg-sub">Crea tus propias categorías (snacks, bebidas, suplementos…) y controla precio, costo y existencias.</div>
  </div>
  <div class="vg-toolbar">
    <div class="vg-chips">
      <button class="vg-chip ${state.catInventario==='todas'?'vg-chip-active':''}" onclick="setCatInventario('todas')">Todas (${state.productos.length})</button>
      ${state.categorias.map(c=>`
        <button class="vg-chip ${state.catInventario===c.id?'vg-chip-active':''}" onclick="setCatInventario('${c.id}')">
          ${esc(c.nombre)} (${state.productos.filter(p=>p.categoriaId===c.id).length})
          <span class="vg-chip-del" onclick="event.stopPropagation(); eliminarCategoria('${c.id}')" title="Eliminar categoría">✕</span>
        </button>`).join("")}
    </div>
    <div class="vg-spacer"></div>
    <button class="vg-btn" onclick="abrirModal('categoria', null)">${ICN.tag(16)} Nueva categoría</button>
    <button class="vg-btn vg-btn-primary" ${state.categorias.length===0?"disabled":""} onclick="abrirModal('producto', null)">${ICN.plus(16)} Nuevo producto</button>
  </div>
  <div class="vg-card" style="padding:0">
    ${state.categorias.length===0 ? emptyHTML("tag","Aún no tienes categorías","Crea la primera — por ejemplo Bebidas, Snacks o Suplementos — y luego agrega productos dentro.","Crear categoría",`onclick="abrirModal('categoria', null)"`)
      : visibles.length===0 ? emptyHTML("package","Sin productos en esta categoría","Agrega el primer producto: nombre, precio de venta, costo y stock.","Agregar producto",`onclick="abrirModal('producto', null)"`)
      : `<div class="vg-table-wrap"><table class="vg-table">
      <thead><tr><th>Producto</th><th>Categoría</th><th>Precio venta</th><th>Costo</th><th>Margen</th><th>Stock</th><th></th></tr></thead>
      <tbody>
        ${visibles.map(p=>{
          const margen = p.precioVenta>0 ? (((p.precioVenta-p.precioCosto)/p.precioVenta)*100).toFixed(0) : "0";
          const bajo = Number(p.stock) <= Number(p.stockMin);
          return `<tr>
            <td class="vg-name-cell">${esc(p.nombre)}</td>
            <td class="vg-dim">${esc(nombreCat(p.categoriaId))}</td>
            <td class="vg-mono">${money(p.precioVenta)}</td>
            <td class="vg-mono vg-dim">${money(p.precioCosto)}</td>
            <td class="vg-mono">${margen}%</td>
            <td>${bajo ? `<span class="vg-badge vg-badge-vencido">${p.stock} · bajo</span>` : `<span class="vg-mono">${p.stock}</span>`}</td>
            <td><div class="vg-icon-row">
              <button class="vg-btn vg-btn-ghost" title="Vender" onclick="abrirModal('venta','${p.id}')">${ICN.cart(15)}</button>
              <button class="vg-btn vg-btn-ghost" title="Editar" onclick="abrirModal('producto','${p.id}')">${ICN.pencil(15)}</button>
              <button class="vg-btn vg-btn-danger-ghost" title="Eliminar" onclick="eliminarProducto('${p.id}')">${ICN.trash(15)}</button>
            </div></td>
          </tr>`;
        }).join("")}
      </tbody>
    </table></div>`}
  </div>`;
}

function eliminarCategoria(id) {
  const cat = state.categorias.find(c=>c.id===id);
  if (!cat) return;
  if (state.productos.some(p=>p.categoriaId===id)) { mostrarToast("Esa categoría tiene productos. Muévelos o elimínalos primero.", "error"); return; }
  if (!confirm(`¿Eliminar la categoría "${cat.nombre}"?`)) return;
  state.categorias = state.categorias.filter(c=>c.id!==id);
  if (state.catInventario===id) state.catInventario = "todas";
  guardar(); render(); mostrarToast("Categoría eliminada.");
}

function eliminarProducto(id) {
  const p = state.productos.find(x=>x.id===id);
  if (!p) return;
  if (!confirm(`¿Eliminar "${p.nombre}" del inventario?`)) return;
  state.productos = state.productos.filter(x=>x.id!==id);
  guardar(); render(); mostrarToast("Producto eliminado.");
}

/* ============================================================
   VISTA: CAJA
   ============================================================ */
function cajaHTML() {
  const mesActual = todayISO().slice(0,7);
  const pagosMes = state.socios.flatMap(s=>s.historial.filter(h=>h.fecha.slice(0,7)===mesActual).map(h=>({...h, socio:s.nombre})));
  const ventasMes = state.ventas.filter(v=>v.fecha.slice(0,7)===mesActual);
  const totalMensualidades = pagosMes.reduce((a,h)=>a+Number(h.monto),0);
  const totalVentas = ventasMes.reduce((a,v)=>a+Number(v.total),0);
  const costoMercancia = ventasMes.reduce((a,v)=>a+Number(v.costoUnit)*Number(v.cantidad),0);
  const gananciaVentas = totalVentas - costoMercancia;
  const movimientos = [
    ...pagosMes.map(h=>({tipo:"mensualidad", desc:h.socio, monto:h.monto, fecha:h.fecha})),
    ...ventasMes.map(v=>({tipo:"venta", desc:`${v.productoNombre} x${v.cantidad}`, monto:v.total, fecha:v.fecha})),
  ].sort((a,b)=> a.fecha < b.fecha ? 1 : -1);

  return `
  <div class="vg-page-head">
    <div class="vg-eyebrow">Caja</div>
    <div class="vg-title">Reporte del mes</div>
    <div class="vg-sub">Ingresos por mensualidades y por ventas de mostrador.</div>
  </div>
  <div class="vg-three-col">
    ${kpiHTML("Mensualidades cobradas", money(totalMensualidades))}
    ${kpiHTML("Ventas de productos", money(totalVentas))}
    ${kpiHTML("Ganancia bruta en ventas", money(gananciaVentas))}
  </div>
  <div class="vg-card" style="margin-bottom:16px">
    <div class="vg-section-title">${ICN.trend(15)} Comparativa del mes</div>
    ${barCompareHTML([{label:"Mensualidades", val:totalMensualidades}, {label:"Ventas", val:totalVentas}])}
  </div>
  <div class="vg-card" style="padding:0">
    <div style="padding:18px 22px 0" class="vg-section-title">Movimientos del mes</div>
    ${movimientos.length===0 ? emptyHTML("wallet","Sin movimientos todavía","Los pagos de mensualidades y ventas de este mes aparecerán aquí.")
      : `<div class="vg-table-wrap"><table class="vg-table">
      <thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Monto</th></tr></thead>
      <tbody>${movimientos.map(m=>`
        <tr><td class="vg-mono vg-dim">${formatDate(m.fecha)}</td>
        <td>${m.tipo==='mensualidad'?'<span class="vg-badge vg-badge-activo"><span class="vg-dot vg-dot-fill"></span>Mensualidad</span>':'<span class="vg-badge vg-badge-porvencer"><span class="vg-dot vg-dot-hollow"></span>Venta</span>'}</td>
        <td>${esc(m.desc)}</td><td class="vg-mono">${money(m.monto)}</td></tr>
      `).join("")}</tbody>
    </table></div>`}
  </div>`;
}

/* ============================================================
   MODALES
   ============================================================ */
let modalDraft = {};

function abrirModal(type, idOrNull) {
  let payload = null;
  if (type==="socio" && idOrNull) payload = state.socios.find(s=>s.id===idOrNull);
  if (type==="producto" && idOrNull) payload = state.productos.find(p=>p.id===idOrNull);
  if (type==="pago") payload = state.socios.find(s=>s.id===idOrNull);
  if (type==="venta") payload = state.productos.find(p=>p.id===idOrNull);
  if (type==="historial") payload = state.socios.find(s=>s.id===idOrNull);
  if (type==="socio") modalDraft = { planNombre: payload?.planNombre || "Mensual", planDias: payload?.planDias || 30 };
  state.modal = { type, payload };
  render();
}
function cerrarModal() { state.modal = null; modalDraft = {}; render(); }

function modalOverlayHTML() {
  const { type, payload } = state.modal;
  let inner = "";
  if (type==="socio") inner = socioModalHTML(payload);
  if (type==="pago") inner = pagoModalHTML(payload);
  if (type==="categoria") inner = categoriaModalHTML();
  if (type==="producto") inner = productoModalHTML(payload);
  if (type==="venta") inner = ventaModalHTML(payload);
  if (type==="historial") inner = historialModalHTML(payload);
  return `<div class="vg-modal-overlay" onclick="if(event.target===this) cerrarModal()"><div class="vg-modal">${inner}</div></div>`;
}

function modalHead(title) {
  return `<div class="vg-modal-head"><div class="vg-modal-title">${title}</div><button class="vg-close-x" onclick="cerrarModal()">${ICN.x(19)}</button></div>`;
}

/* --- Socio --- */
function socioModalHTML(s) {
  const editando = !!s;
  const planNombre = modalDraft.planNombre;
  const planDias = modalDraft.planDias;
  return `
  ${modalHead(editando ? "Editar socio" : "Nuevo socio")}
  <div class="vg-field"><label class="vg-label">Nombre completo</label>
    <input class="vg-input" id="f-nombre" value="${editando?esc(s.nombre):""}" placeholder="Ej. Carlos Martínez" autofocus></div>
  <div class="vg-field"><label class="vg-label">Teléfono (opcional)</label>
    <input class="vg-input" id="f-telefono" value="${editando?esc(s.telefono):""}" placeholder="9999-9999"></div>
  <div class="vg-field"><label class="vg-label">Plan</label>
    <div class="vg-plan-chips" id="plan-chips">
      ${PLANES.map(p=>`<button type="button" class="vg-plan-chip ${planNombre===p.nombre?'vg-plan-chip-active':''}" data-plan="${p.nombre}" onclick="seleccionarPlan('${p.nombre}', ${p.dias}, ${editando})">${p.nombre}</button>`).join("")}
    </div>
    <div class="vg-hint" id="plan-hint">Duración: ${planDias} días. Puedes ajustar el vencimiento manualmente abajo.</div>
  </div>
  <div class="vg-row2">
    <div class="vg-field"><label class="vg-label">Precio de la cuota (L)</label>
      <input class="vg-input" id="f-precio" type="number" min="0" step="0.01" value="${editando?s.precio:""}" placeholder="0.00"></div>
    <div class="vg-field"><label class="vg-label">Fecha de vencimiento</label>
      <input class="vg-input" id="f-vencimiento" type="date" value="${editando?s.fechaVencimiento:addDays(todayISO(),30)}"></div>
  </div>
  <label class="vg-check-row"><input type="checkbox" id="f-congelado" ${editando&&s.congelado?"checked":""}> ${ICN.snow(13)} Congelar membresía (pausa, no cuenta como moroso)</label>
  <div class="vg-modal-foot">
    <button class="vg-btn vg-btn-block" onclick="cerrarModal()">Cancelar</button>
    <button class="vg-btn vg-btn-primary vg-btn-block" onclick="guardarSocio('${editando?s.id:""}')">Guardar socio</button>
  </div>`;
}

function seleccionarPlan(nombre, dias, editando) {
  modalDraft.planNombre = nombre; modalDraft.planDias = dias;
  document.querySelectorAll("#plan-chips .vg-plan-chip").forEach(el => {
    el.classList.toggle("vg-plan-chip-active", el.getAttribute("data-plan")===nombre);
  });
  document.getElementById("plan-hint").textContent = `Duración: ${dias} días. Puedes ajustar el vencimiento manualmente abajo.`;
  if (!editando) document.getElementById("f-vencimiento").value = addDays(todayISO(), dias);
}

function guardarSocio(idExistente) {
  const nombre = document.getElementById("f-nombre").value.trim();
  if (!nombre) { mostrarToast("Ponle un nombre al socio.", "error"); return; }
  const telefono = document.getElementById("f-telefono").value.trim();
  const precio = Number(document.getElementById("f-precio").value) || 0;
  const fechaVencimiento = document.getElementById("f-vencimiento").value || addDays(todayISO(), modalDraft.planDias);
  const congelado = document.getElementById("f-congelado").checked;
  const existe = idExistente && state.socios.some(s=>s.id===idExistente);
  const base = existe ? state.socios.find(s=>s.id===idExistente) : null;
  const socio = {
    id: existe ? idExistente : uid(),
    nombre, telefono, planNombre: modalDraft.planNombre, planDias: modalDraft.planDias,
    precio, fechaInicio: base?.fechaInicio || todayISO(), fechaVencimiento, congelado,
    historial: base?.historial || [],
  };
  state.socios = existe ? state.socios.map(s=>s.id===idExistente?socio:s) : [...state.socios, socio];
  guardar(); cerrarModal(); mostrarToast(existe ? "Socio actualizado." : "Socio agregado.");
}

/* --- Pago --- */
function pagoModalHTML(s) {
  const base = daysDiff(s.fechaVencimiento) > 0 ? s.fechaVencimiento : todayISO();
  const nuevaFecha = addDays(base, s.planDias);
  return `
  ${modalHead("Registrar pago")}
  <div class="vg-hint" style="margin-bottom:16px">${esc(s.nombre)} · plan ${esc(s.planNombre)} (${s.planDias} días)</div>
  <div class="vg-row2">
    <div class="vg-field"><label class="vg-label">Monto (L)</label>
      <input class="vg-input" id="f-monto" type="number" min="0" step="0.01" value="${s.precio||0}"></div>
    <div class="vg-field"><label class="vg-label">Método</label>
      <select class="vg-select" id="f-metodo"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div>
  </div>
  <div class="vg-hint">Nuevo vencimiento: <strong style="color:var(--white-pure)">${formatDate(nuevaFecha)}</strong></div>
  <div class="vg-modal-foot" style="margin-top:16px">
    <button class="vg-btn vg-btn-block" onclick="cerrarModal()">Cancelar</button>
    <button class="vg-btn vg-btn-primary vg-btn-block" onclick="confirmarPago('${s.id}', '${nuevaFecha}')">Confirmar pago</button>
  </div>`;
}

function confirmarPago(socioId, nuevaFecha) {
  const monto = Number(document.getElementById("f-monto").value) || 0;
  const metodo = document.getElementById("f-metodo").value;
  state.socios = state.socios.map(s => {
    if (s.id !== socioId) return s;
    return { ...s, fechaVencimiento: nuevaFecha, congelado: false, historial: [...s.historial, {id:uid(), fecha:todayISO(), monto, metodo}] };
  });
  guardar(); cerrarModal(); mostrarToast(`Pago registrado. Próximo vencimiento: ${formatDate(nuevaFecha)}.`);
}

/* --- Historial --- */
function historialModalHTML(s) {
  const pagos = [...s.historial].sort((a,b)=> a.fecha < b.fecha ? 1 : -1);
  return `
  ${modalHead("Historial de pagos")}
  <div class="vg-hint" style="margin-bottom:16px">${esc(s.nombre)} · ${esc(s.planNombre)}</div>
  ${pagos.length===0 ? `<div class="vg-hint">Sin pagos registrados todavía.</div>` :
    `<div style="max-height:320px; overflow-y:auto;">${pagos.map(h=>`
    <div class="vg-mini-item"><div><div class="vg-mini-name">${money(h.monto)}</div><div class="vg-mini-sub">${esc(h.metodo)}</div></div><div class="vg-dim vg-mono" style="font-size:12.5px">${formatDate(h.fecha)}</div></div>
    `).join("")}</div>`}
  <div class="vg-modal-foot" style="margin-top:18px"><button class="vg-btn vg-btn-block" onclick="cerrarModal()">Cerrar</button></div>`;
}

/* --- Categoría --- */
function categoriaModalHTML() {
  return `
  ${modalHead("Nueva categoría")}
  <div class="vg-field"><label class="vg-label">Nombre de la categoría</label>
    <input class="vg-input" id="f-cat-nombre" placeholder="Ej. Bebidas energéticas" autofocus></div>
  <div class="vg-modal-foot">
    <button class="vg-btn vg-btn-block" onclick="cerrarModal()">Cancelar</button>
    <button class="vg-btn vg-btn-primary vg-btn-block" onclick="guardarCategoria()">Crear</button>
  </div>`;
}
function guardarCategoria() {
  const nombre = document.getElementById("f-cat-nombre").value.trim();
  if (!nombre) { mostrarToast("Ponle un nombre a la categoría.", "error"); return; }
  state.categorias = [...state.categorias, {id:uid(), nombre}];
  guardar(); cerrarModal(); mostrarToast("Categoría creada.");
}

/* --- Producto --- */
function productoModalHTML(p) {
  const editando = !!p;
  return `
  ${modalHead(editando ? "Editar producto" : "Nuevo producto")}
  <div class="vg-field"><label class="vg-label">Nombre del producto</label>
    <input class="vg-input" id="f-prod-nombre" value="${editando?esc(p.nombre):""}" placeholder="Ej. Gatorade 500ml" autofocus></div>
  <div class="vg-field"><label class="vg-label">Categoría</label>
    <select class="vg-select" id="f-prod-cat">${state.categorias.map(c=>`<option value="${c.id}" ${editando&&p.categoriaId===c.id?"selected":""}>${esc(c.nombre)}</option>`).join("")}</select></div>
  <div class="vg-row2">
    <div class="vg-field"><label class="vg-label">Precio de venta (L)</label>
      <input class="vg-input" id="f-prod-venta" type="number" min="0" step="0.01" value="${editando?p.precioVenta:""}" placeholder="0.00"></div>
    <div class="vg-field"><label class="vg-label">Precio de costo (L)</label>
      <input class="vg-input" id="f-prod-costo" type="number" min="0" step="0.01" value="${editando?p.precioCosto:""}" placeholder="0.00"></div>
  </div>
  <div class="vg-row2">
    <div class="vg-field"><label class="vg-label">Stock actual</label>
      <input class="vg-input" id="f-prod-stock" type="number" min="0" value="${editando?p.stock:""}" placeholder="0"></div>
    <div class="vg-field"><label class="vg-label">Alertar si baja de</label>
      <input class="vg-input" id="f-prod-min" type="number" min="0" value="${editando?p.stockMin:5}"></div>
  </div>
  <div class="vg-modal-foot">
    <button class="vg-btn vg-btn-block" onclick="cerrarModal()">Cancelar</button>
    <button class="vg-btn vg-btn-primary vg-btn-block" onclick="guardarProducto('${editando?p.id:""}')">Guardar producto</button>
  </div>`;
}
function guardarProducto(idExistente) {
  const nombre = document.getElementById("f-prod-nombre").value.trim();
  if (!nombre) { mostrarToast("Ponle un nombre al producto.", "error"); return; }
  const categoriaId = document.getElementById("f-prod-cat").value;
  const precioVenta = Number(document.getElementById("f-prod-venta").value) || 0;
  const precioCosto = Number(document.getElementById("f-prod-costo").value) || 0;
  const stock = Number(document.getElementById("f-prod-stock").value) || 0;
  const stockMin = Number(document.getElementById("f-prod-min").value) || 0;
  const existe = idExistente && state.productos.some(p=>p.id===idExistente);
  const producto = { id: existe?idExistente:uid(), nombre, categoriaId, precioVenta, precioCosto, stock, stockMin };
  state.productos = existe ? state.productos.map(p=>p.id===idExistente?producto:p) : [...state.productos, producto];
  guardar(); cerrarModal(); mostrarToast(existe ? "Producto actualizado." : "Producto agregado.");
}

/* --- Venta --- */
function ventaModalHTML(p) {
  return `
  ${modalHead("Registrar venta")}
  <div class="vg-hint" style="margin-bottom:16px">${esc(p.nombre)} · disponibles: ${p.stock} · ${money(p.precioVenta)} c/u</div>
  <div class="vg-field"><label class="vg-label">Cantidad</label>
    <input class="vg-input" id="f-venta-cant" type="number" min="1" value="1" oninput="actualizarPreviewVenta(${p.precioVenta}, ${p.stock})" autofocus></div>
  <div class="vg-hint" id="venta-warning" style="color:var(--white-pure); margin-bottom:10px; display:none">No hay suficiente stock para esta cantidad.</div>
  <div class="vg-hint">Total: <strong style="color:var(--white-pure)" id="venta-total">${money(p.precioVenta)}</strong></div>
  <div class="vg-modal-foot" style="margin-top:16px">
    <button class="vg-btn vg-btn-block" onclick="cerrarModal()">Cancelar</button>
    <button class="vg-btn vg-btn-primary vg-btn-block" id="venta-confirm-btn" onclick="confirmarVenta('${p.id}')">Confirmar venta</button>
  </div>`;
}
function actualizarPreviewVenta(precioVenta, stockDisponible) {
  const cant = Number(document.getElementById("f-venta-cant").value) || 0;
  document.getElementById("venta-total").textContent = money(cant * precioVenta);
  const excede = cant > stockDisponible || cant <= 0;
  document.getElementById("venta-warning").style.display = (cant > stockDisponible) ? "block" : "none";
  document.getElementById("venta-confirm-btn").disabled = excede;
}
function confirmarVenta(productoId) {
  const p = state.productos.find(x=>x.id===productoId);
  const cantidad = Number(document.getElementById("f-venta-cant").value) || 0;
  if (cantidad <= 0 || cantidad > p.stock) return;
  state.productos = state.productos.map(x => x.id===productoId ? {...x, stock: x.stock - cantidad} : x);
  state.ventas = [...state.ventas, {id:uid(), productoId:p.id, productoNombre:p.nombre, cantidad, precioUnit:p.precioVenta, costoUnit:p.precioCosto, total:cantidad*p.precioVenta, fecha:todayISO()}];
  guardar(); cerrarModal(); mostrarToast("Venta registrada.");
}

/* ============================================================
   INIT
   ============================================================ */
cargarOSemilla();
render();
</script>
</body>
</html>
